name: wisewallet_landing
description: Official landing page and APK distribution portal for WiseWallet.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/wisewallet_app_icon_master.png
    - assets/branding/wisewallet_splash_logo.svg
    - assets/branding/wisewallet_splash_wallet.svg
    - assets/branding/wisewallet_splash_card.svg
    - assets/branding/wisewallet_splash_mark.svg
